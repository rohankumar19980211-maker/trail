name: 🚀 Deploy BOXRETAIL to Shared Hosting (public_html)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: 🔨 Build Production Frontend Assets
        working-directory: ./client
        run: npm run build

      - name: 📑 Bundle Native PHP API & Data Storage
        run: |
          mkdir -p client/dist/api
          mkdir -p client/dist/data
          cp -r server/php_api/* client/dist/api/
          cp -r server/data/* client/dist/data/

      - name: 🚀 Deploy Build to Shared Hosting public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./client/dist/
          dangerous-clean-slate: false
